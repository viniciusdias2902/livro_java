name: Publicar o livro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livro-production
  cancel-in-progress: true

env:
  MDBOOK_VERSION: "0.5.4"
  MDBOOK_MERMAID_VERSION: "0.17.1"
  VPS_HOST: 76.13.239.66
  VPS_USER: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: https://java.viniciusdias.tech
    steps:
      - uses: actions/checkout@v4

      - name: Instalar mdBook e o preprocessador mermaid
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          curl -sSL "https://github.com/badboy/mdbook-mermaid/releases/download/v${MDBOOK_MERMAID_VERSION}/mdbook-mermaid-v${MDBOOK_MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verificar o registro do texto
        run: |
          python3 lint.py
          python3 lint.py --esqueleto

      - name: Construir o livro
        run: mdbook build

      - name: Configurar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "VPS_SSH_KEY não está configurado"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "VPS_KNOWN_HOSTS não está configurado"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Publicar na VPS
        run: |
          rsync --archive --compress --delete \
            book/ "$VPS_USER@$VPS_HOST:/var/www/java.viniciusdias.tech/"
